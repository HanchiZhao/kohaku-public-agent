[project]
name = "kohaku-public-agent-lab"
version = "0.5.0"
description = "Public AI agent research and backend integration based on KohakuTerrarium."
requires-python = ">=3.12,<3.13"
dependencies = [
    "kohakuterrarium",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.36,<3.0",
    "aiosqlite>=0.20.0,<1.0",
]

[tool.uv.sources]
kohakuterrarium = { path = "../KohakuTerrarium", editable = true }